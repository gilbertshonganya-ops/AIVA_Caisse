<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b7a3e">
  <meta name="description" content="EvoBuskin : caisse, stock et dettes clients, même sans Internet.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co https://*.supabase.in wss://*.supabase.co wss://*.supabase.in; font-src 'self'; form-action 'self';">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <title>EvoBuskin</title>
</head>
<body>
  <!-- Écran de chargement affiché pendant l'ouverture de la base -->
  <div id="chargement"><img src="icons/logo.png" alt="EvoBuskin" width="128" height="128"><p>EvoBuskin</p></div>

  <div id="app" hidden>
    <header id="barre">
      <div class="barre-gauche">
        <strong id="nomBoutique">EvoBuskin</strong>
        <small id="infoRole"></small>
      </div>
      <div class="barre-droite">
        <span id="etatReseau" class="pastille">En ligne</span>
        <button id="btnQuitter" class="btn-icone" aria-label="Se déconnecter">&#128274;</button>
      </div>
    </header>
    <main id="vue"></main>
    <nav id="menu"></nav>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Ordre important : utilitaires, base de données, modules, vues, puis application -->
  <script src="js/diag.js"></script>
  <script src="js/chargeur.js"></script>
  <script src="js/auth-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-hors-ligne.js"></script>
  <script src="js/auth-ui.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/periode.js"></script>
  <script src="js/db.js"></script>
  <script src="js/cloud-db.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/temps-reel.js"></script>
  <script src="js/cloud-sync.js"></script>
  <script src="js/audit.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/coffre.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/vue-caisse.js"></script>
  <script src="js/vue-stock.js"></script>
  <script src="js/vue-dettes.js"></script>
  <script src="js/vue-depenses.js"></script>
  <script src="js/vue-achats.js"></script>
  <script src="js/vue-import.js"></script>
  <script src="js/vue-audit.js"></script>
  <script src="js/vue-rapports.js"></script>
  <script src="js/vue-plus.js"></script>
  <script src="js/vue-reglages.js"></script>
  <script src="js/vue-compte.js"></script>
  <script src="js/vue-boutiques.js"></script>
  <script src="js/abonnement.js"></script>
  <script src="js/equipe.js"></script>
  <script src="js/security-monitor.js"></script>
  <script src="js/subscriptions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
