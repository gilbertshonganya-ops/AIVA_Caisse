<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b7a3e">
  <meta name="description" content="AIVA Caisse : caisse, stock et dettes clients, même sans Internet.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <title>AIVA Caisse</title>
</head>
<body>
  <!-- Écran de chargement affiché pendant l'ouverture de la base -->
  <div id="chargement"><div class="logo-rond">A</div><p>AIVA Caisse</p></div>

  <div id="app" hidden>
    <header id="barre">
      <div class="barre-gauche">
        <strong id="nomBoutique">AIVA Caisse</strong>
        <small id="infoRole"></small>
      </div>
      <div class="barre-droite">
        <span id="etatReseau" class="pastille">En ligne</span>
        <button id="btnQuitter" class="btn-icone" aria-label="Verrouiller">&#128274;</button>
      </div>
    </header>
    <main id="vue"></main>
    <nav id="menu"></nav>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Ordre important : utilitaires, base de données, vues, puis application -->
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/vue-caisse.js"></script>
  <script src="js/vue-stock.js"></script>
  <script src="js/vue-dettes.js"></script>
  <script src="js/vue-rapports.js"></script>
  <script src="js/vue-reglages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
